# Bitcoin Core configuration for Lab 01
#
# Every setting below is annotated. Read this file before running the lab:
# the configuration IS part of the teaching material, not boilerplate.

# ---------------------------------------------------------------------------
# Network selection
# ---------------------------------------------------------------------------

# Regression test mode: a private chain under our own control.
#   - difficulty is 1, so blocks are mined instantly on request
#   - blocks are produced only when we ask for them (`-generate`)
#   - the chain has its own genesis block and connects to no public peer
# This is what makes the lab deterministic.
regtest=1

# ---------------------------------------------------------------------------
# RPC interface
# ---------------------------------------------------------------------------

# Accept JSON-RPC connections. Without this, bitcoin-cli cannot talk to the daemon.
server=1

# Credentials. Trivial values are acceptable ONLY because this node is
# reachable exclusively from localhost on a throwaway private chain.
# On any real deployment use `rpcauth` with a salted hash instead.
rpcuser=lab
rpcpassword=lab

[regtest]
# Bind the RPC listener inside the container to all interfaces so that Docker's
# port mapping can reach it. The host-side binding in docker-compose.yml is
# restricted to 127.0.0.1, so the port is not exposed to your network.
rpcbind=0.0.0.0
rpcport=18443

# Which client addresses may issue RPC calls. 172.16.0.0/12 is Docker's default
# bridge range; without this the daemon rejects connections from the host.
rpcallowip=127.0.0.1
rpcallowip=172.16.0.0/12

# P2P listener. A single-node lab does not need peers, but leaving this enabled
# allows the optional exercise of starting a second node and observing block
# propagation between them.
bind=0.0.0.0:18444
port=18444

# ---------------------------------------------------------------------------
# Indexing
# ---------------------------------------------------------------------------

# Maintain a full transaction index. This is what makes `getrawtransaction`
# work for arbitrary transactions rather than only wallet-relevant ones.
# On mainnet this costs tens of gigabytes; on regtest it is free.
txindex=1

# ---------------------------------------------------------------------------
# Fee policy
# ---------------------------------------------------------------------------

# Minimum fee rate (BTC/kvB) for a transaction to be relayed and mined.
# The default 0.00001 is fine, but we set it explicitly so that the
# "min relay fee not met" error in Part B is reproducible and explainable.
minrelaytxfee=0.00001

# Fee rate the wallet uses when it is asked to choose one itself.
# Part B computes fees by hand, so this only affects convenience RPCs.
fallbackfee=0.0002

# ---------------------------------------------------------------------------
# Wallet
# ---------------------------------------------------------------------------

# Do not create a default unnamed wallet on first start. The lab creates a
# named descriptor wallet explicitly, so that wallet handling is visible
# rather than implicit.

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------

# Timestamps on log lines; useful when correlating mempool acceptance with
# your own commands.
logtimestamps=1

# Uncomment to trace mempool acceptance and rejection decisions in detail.
# Recommended if a transaction is rejected and the CLI error is not enough.
# debug=mempool
# debug=rpc
